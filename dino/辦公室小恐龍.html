<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>辦公室小恐龍</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入自動生成的首頁與小恐龍數據檔 -->
    <script
      src="dino_data.txt"
      onerror="console.log('尚未生成備份檔，將使用預設暫存')"
    ></script>
    <!-- 引入 Google Fonts (韓系字型) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- 引入 FontAwesome 圖示 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
    />
    <style>
      body {
        font-family: "Noto Sans TC", sans-serif;
        background: transparent;
        color: #4a3f35;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        position: relative;
      }
      .memo-box {
        background: #fffdf9;
        border: 1px solid #eae6df;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.01);
        transition: all 0.3s;
      }
      /* 🦖 漂浮的電子雞本體 */
      .floating-dino {
        position: fixed;
        bottom: 16px;
        right: 16px;
        width: 100%;
        max-width: 360px;
        height: min(480px, calc(100vh - 32px));
        background: rgba(255, 253, 249, 0.98);
        backdrop-filter: blur(10px);
        border: 1px solid #eae6df;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        border-radius: 1.5rem;
        transition:
          width 0.3s cubic-bezier(0.16, 1, 0.3, 1),
          padding 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: 99999;
      }
      #dinoSpeech {
        word-break: break-all;
        white-space: normal !important;
        overflow-wrap: anywhere;
      }
      @keyframes bossAlert {
        0% {
          border-color: #eae6df;
          background: rgba(255, 253, 249, 0.98);
        }
        50% {
          border-color: #e06c75;
          background: rgba(255, 235, 238, 0.98);
        }
        100% {
          border-color: #eae6df;
          background: rgba(255, 253, 249, 0.98);
        }
      }
      .boss-incoming {
        animation: bossAlert 1s infinite;
      }
      /* 強制讓 hidden 真正隱藏元素 */
      .hidden {
        display: none !important;
      }
      #panelStats {
        height: 105px !important;
        max-height: 105px !important;
        flex-direction: column !important;
        justify-content: space-between !important; /* 讓三條進度條上下均分 */
        padding: 4px 0 !important;
      }
      #panelStats > div {
        display: flex !important;
        align-items: center !important;
        white-space: nowrap !important;
      }
      #panelStats span {
        flex-shrink: 0 !important;
      }
      .market-tab-btn {
        font-size: 9px;
        font-weight: 500;
        padding: 3px 8px;
        border-radius: 6px 6px 0 0;
        cursor: pointer;
        background: #eae6df;
        color: #8c7e70;
        border: 1px solid #d9d2c5;
        border-bottom: none;
      }
      .market-tab-btn.active {
        background: #fffdf9;
        color: #4a3f35;
        font-weight: bold;
        border-color: #eae6df;
        border-bottom: 2px solid #fffdf9;
        position: relative;
        z-index: 10;
      }
      #panelMarket {
        height: 200px !important;
        min-height: 200px !important;
        max-height: 200px !important;
        overflow: hidden !important;
      }

      #marketContent {
        min-height: 0;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #d9d2c5 transparent;
      }

      #subPanelFood,
      #subPanelGame,
      #subPanelPet {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        align-content: start;
      }

      #subPanelFood:not(.hidden),
      #subPanelGame:not(.hidden),
      #subPanelPet:not(.hidden) {
        display: grid;
      }

      .market-item {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid #eae6df;
        border-radius: 10px;
        padding: 6px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 5px;
        min-width: 0;
      }

      .market-game {
        min-height: 54px;
        text-align: left;
        transition: background 0.2s;
      }

      .market-pet {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid #eae6df;
        border-radius: 10px;
        padding: 7px 5px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
        min-width: 0;
        cursor: pointer;
        transition: all 0.2s;
      }

      .market-pet:hover {
        background: #f5f2eb;
        border-color: #94a684;
      }

      .market-pet-emoji {
        font-size: 23px;
        line-height: 1.4;
      }

      .market-pet-name {
        font-size: 10px;
        font-weight: bold;
        color: #4a3f35;
      }

      #panelStats {
        height: 150px !important;
        max-height: 150px !important;
        flex-direction: column !important;
        justify-content: space-between !important;
        padding: 8px 0 !important;
        overflow: hidden !important;
      }
      #panelStats > .stats-hint {
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        gap: 6px !important;
        padding: 6px 8px;
        border: 1px solid #eae6df;
        border-radius: 9px;
        background: rgba(255,255,255,.8);
        color: #8c7e70;
        font-size: 8px;
        line-height: 1.25;
        white-space: normal !important;
      }
      /* 互動頁：精簡三欄兩排 */
#panelAction {
  height: 155px !important;
  min-height: 155px !important;
  max-height: 155px !important;
  overflow: hidden !important;
}

#panelAction:not(.hidden) {
  display: grid !important;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: repeat(2, 54px);
  align-content: start;
  justify-content: stretch;
  gap: 8px;
  padding: 8px 4px;
}

#panelAction > button {
  height: 54px !important;
  min-width: 0;
  padding: 4px 2px !important;
  line-height: 1.3;
  font-size: 10px;
}

/* 各分頁高度獨立控制 */

/* 背包：維持原本高度 */
#panelFeed {
  height: 200px !important;
  min-height: 200px !important;
  max-height: 200px !important;
}

/* 商場：維持原本高度 */
#panelMarket {
  height: 200px !important;
  min-height: 200px !important;
  max-height: 200px !important;
}

/* 互動：獨立縮小 */
#panelAction {
  height: 155px !important;
  min-height: 155px !important;
  max-height: 155px !important;
}
      .stock-select-card { min-height: 44px; border: 1px solid #EAE6DF; border-radius: 12px; background: rgba(255,255,255,.88); padding: 6px 8px; text-align: left; color: #5C5247; }
      .stock-select-card.stock-selected { border: 2px solid #94A684; background: #F7F8F3; padding: 6px 7px; }
      .stock-qty-control { display: flex; align-items: center; height: 24px; border: 1px solid #eae6df; border-radius: 7px; overflow: hidden; background: #fff; flex-shrink: 0; }
      .stock-qty-control button { width: 18px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 11px; line-height: 1; color: #5c5247; }
      .stock-qty-control input { width: 24px; height: 24px; text-align: center; font-size: 10px; font-weight: 700; outline: none; border-left: 1px solid #eae6df; border-right: 1px solid #eae6df; }
      #dinoExpandedBody { flex: 1 1 auto; min-height: 0; }
      #dinoPanel { flex: 1 1 auto; min-height: 0; overflow: hidden; }
      #panelFeed { height: 200px !important; min-height: 200px !important; max-height: 200px !important; overflow: hidden !important; }
      #bagFoodSection, #bagSnackSection { max-height: 158px; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-right: 2px; align-content: start; }
      #bagFoodGrid, #bagSnackGrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; align-content: start; }
      #panelAction button:disabled, #subPanelPet button:disabled, #dinoSpeech button:disabled { background: #eeece7 !important; color: #a39e93 !important; border-color: #e5e1d8 !important; opacity: .72; filter: grayscale(.7); cursor: not-allowed !important; box-shadow: none !important; }
      #subPanelGame .market-game { min-height: 90px; text-align: left; transition: background .2s; }
      #panelAction button[onclick="playToy()"] { background: #fff9e9; border-color: #efe2c6; }
      #panelAction button[onclick="giveHug()"] { background: #fff4f7; border-color: #efdae3; }
      #panelAction button#workBtn { background: #f2f7ee; border-color: #dce6d5; }
      #panelAction button[onclick="punchAir()"] { background: #fff4f3; border-color: #f1dcd9; }
      #panelAction button[onclick="takePaidPoop()"] { background: #fff8e9; border-color: #efe2ca; }
      .stat-critical { background-color: #e06c75 !important; }
      input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      .food-qty-control { display: flex; align-items: center; height: 26px; border: 1px solid #eae6df; border-radius: 8px; overflow: hidden; background: #fff; flex-shrink: 0; }
      .food-qty-control button { width: 21px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 10px; line-height: 1; color: #5c5247; background: #fff; }
      .food-qty-control button:hover { background: #f5f2eb; }
      .food-qty-control input { width: 24px; height: 26px; padding: 0; text-align: center; font-size: 11px; font-weight: 700; color: #4a3f35; outline: none; border-left: 1px solid #eae6df; border-right: 1px solid #eae6df; background: #fff; }
    </style>
  </head>
  <body>
    <!-- 🦖 獨立電子雞主體 (調整 p-4 -> p-3, max-w-360px -> 330px 讓整體更小巧) -->
    <div
      id="dinoCard"
      class="floating-dino p-3 rounded-2xl flex flex-col gap-2 shadow-2xl"
      style="max-width: 330px"
    >
      <div
        class="flex justify-between items-center text-[10px] font-bold text-[#8C7E70] w-full"
      >
        <div class="flex items-center gap-2">
          <span class="flex items-center gap-1.5"
            ><i class="fa-solid fa-shield-cat text-[#94A684]"></i>
            辦公室小恐龍</span
          >
          <span
            class="bg-[#F5F2EB] px-2 py-0.5 rounded-full text-[9px] text-[#7C7063] font-bold border border-[#EAE6DF]"
          >
            💰 <span id="coinCount">0</span>
          </span>
        </div>
        <div class="flex items-center gap-2">
          <span id="dinoTitle" class="text-[9px] text-[#A39E93] font-normal"
            >狀態：正常運轉</span
          >
          </div>
      </div>

      <div id="dinoExpandedBody" class="flex flex-col gap-2.5">
        <!-- 對話框 (加上 h-[46px] 與 overflow-hidden 鎖死高度，避免切換文字時跳動) -->
        <div
          class="bg-[#FFFDF9] px-2.5 py-1.5 rounded-2xl border border-[#EAE6DF] flex items-center gap-3 transition select-none shadow-xs min-h-[110px] overflow-y-auto"
        >
          <div
            id="dinoIcon"
            class="w-9 h-9 rounded-xl bg-[#F5F2EB] border border-[#EAE6DF] flex items-center justify-center text-xl shrink-0"
          >
            🦖
          </div>
          <div class="flex-1 min-w-0 h-full flex items-center overflow-auto">
            <p
              id="dinoSpeech"
              class="text-[11px] text-[#5C5247] font-medium w-full leading-tight break-all whitespace-normal"
            >
              「吼——（隕石來啦!🔥）」
            </p>
          </div>
        </div>

        <div
          id="dinoPanel"
          class="bg-[#F5F2EB]/50 p-2 rounded-xl border border-[#EAE6DF] min-h-[65px] flex flex-col justify-center"
        >
          <!-- 狀態 -->
          <div
            id="panelStats"
            class="hidden flex flex-col text-[9px] text-[#A39E93]"
          >
            <div class="flex items-center gap-2">
              <span class="w-8 shrink-0 text-[#7C7063] font-bold">🍗 飢餓</span>
              <div
                class="flex-1 h-1.5 bg-[#EAE6DF] rounded-full overflow-hidden"
              >
                <div
                  id="hungerBar"
                  class="h-full bg-[#94A684] w-[80%] rounded-full"
                ></div>
              </div>
              <span
                id="hungerText"
                class="w-7 text-right font-bold text-[#5C5247]"
                >80%</span
              >
            </div>
            <div class="flex items-center gap-2">
              <span class="w-8 shrink-0 text-[#7C7063] font-bold">☕ 口渴</span>
              <div
                class="flex-1 h-1.5 bg-[#EAE6DF] rounded-full overflow-hidden"
              >
                <div
                  id="thirstBar"
                  class="h-full bg-[#54B4D3] w-[80%] rounded-full"
                ></div>
              </div>
              <span
                id="thirstText"
                class="w-7 text-right font-bold text-[#5C5247]"
                >80%</span
              >
            </div>
            <div class="flex items-center gap-2">
              <span class="w-8 shrink-0 text-[#7C7063] font-bold">✨ 心情</span>
              <div
                class="flex-1 h-1.5 bg-[#EAE6DF] rounded-full overflow-hidden"
              >
                <div
                  id="moodBar"
                  class="h-full bg-[#E5A953] w-[80%] rounded-full"
                ></div>
              </div>
              <span
                id="moodText"
                class="w-7 text-right font-bold text-[#5C5247]"
                >80%</span
              >
            </div>
            <div class="stats-hint"><span>⏱️ 每 15 秒下降 5%</span><span>低於 30% 不能派打工</span></div>
          </div>

          <!-- 背包 -->
          <div id="panelFeed" class="hidden flex flex-col h-full text-xs">
            <!-- 背包分類 -->
            <div class="grid grid-cols-2 gap-1 mb-2">
              <button
                onclick="switchBagCategory('food')"
                id="bagTabFood"
                class="bg-[#94A684] text-white rounded-lg py-1 text-[10px] font-bold"
              >
                🍗 一般食物
              </button>

              <button
                onclick="switchBagCategory('snack')"
                id="bagTabSnack"
                class="bg-white text-[#7C7063] border border-[#EAE6DF] rounded-lg py-1 text-[10px] font-bold"
              >
                🍪 打工零食
              </button>
            </div>

            <!-- 一般食物 -->
            <div id="bagFoodSection">
              <div id="bagFoodGrid" class="grid grid-cols-3 gap-1.5 text-center">
                <div
                  onclick="selectBagItem('chicken')"
                  id="slot_chicken"
                  class="relative bg-white hover:bg-[#F5F2EB] p-1.5 rounded-lg border border-[#EAE6DF] cursor-pointer flex flex-col items-center justify-center transition select-none"
                >
                  <span class="text-sm">🍗</span>
                  <span
                    id="count_chicken"
                    class="absolute bottom-0.5 right-1 text-[9px] text-[#8C7E70] font-bold"
                    >0</span
                  >
                </div>

                <div
                  onclick="selectBagItem('sprite')"
                  id="slot_sprite"
                  class="relative bg-white hover:bg-[#F5F2EB] p-1.5 rounded-lg border border-[#EAE6DF] cursor-pointer flex flex-col items-center justify-center transition select-none"
                >
                  <span class="text-sm">🧊</span>
                  <span
                    id="count_sprite"
                    class="absolute bottom-0.5 right-1 text-[9px] text-[#8C7E70] font-bold"
                    >0</span
                  >
                </div>

                <div
                  onclick="selectBagItem('beer')"
                  id="slot_beer"
                  class="relative bg-white hover:bg-[#F5F2EB] p-1.5 rounded-lg border border-[#EAE6DF] cursor-pointer flex flex-col items-center justify-center transition select-none"
                >
                  <span class="text-sm">🍺</span>
                  <span
                    id="count_beer"
                    class="absolute bottom-0.5 right-1 text-[9px] text-[#8C7E70] font-bold"
                    >0</span
                  >
                </div>

                <div
                  onclick="selectBagItem('salad')"
                  id="slot_salad"
                  class="relative bg-white hover:bg-[#F5F2EB] p-1.5 rounded-lg border border-[#EAE6DF] cursor-pointer flex flex-col items-center justify-center transition select-none"
                >
                  <span class="text-sm">🥗</span>
                  <span
                    id="count_salad"
                    class="absolute bottom-0.5 right-1 text-[9px] text-[#8C7E70] font-bold"
                    >0</span
                  >
                </div>
              </div>
            </div>

            <!-- 打工零食 -->
            <div id="bagSnackSection" class="hidden">
              <div id="bagSnackGrid" class="grid grid-cols-3 gap-1.5 text-center">
                <div
                  onclick="selectBagItem('cookie')"
                  id="slot_cookie"
                  class="relative bg-white p-1.5 rounded-lg border border-[#EAE6DF] cursor-pointer flex flex-col items-center justify-center"
                >
                  <span class="text-sm">🍪</span><span class="text-[8px] leading-tight text-[#5C5247]">恐龍餅乾</span>
                  <span
                    id="count_cookie"
                    class="absolute bottom-0.5 right-1 text-[9px] text-[#8C7E70] font-bold"
                    >0</span
                  >
                </div>

                <div
                  onclick="selectBagItem('cake')"
                  id="slot_cake"
                  class="relative bg-white p-1.5 rounded-lg border border-[#EAE6DF] cursor-pointer flex flex-col items-center justify-center"
                >
                  <span class="text-sm">🧁</span><span class="text-[8px] leading-tight text-[#5C5247]">主管蛋糕</span>
                  <span
                    id="count_cake"
                    class="absolute bottom-0.5 right-1 text-[9px] text-[#8C7E70] font-bold"
                    >0</span
                  >
                </div>

                <div
                  onclick="selectBagItem('candy')"
                  id="slot_candy"
                  class="relative bg-white p-1.5 rounded-lg border border-[#EAE6DF] cursor-pointer flex flex-col items-center justify-center"
                >
                  <span class="text-sm">🍬</span><span class="text-[8px] leading-tight text-[#5C5247]">加班糖果</span>
                  <span
                    id="count_candy"
                    class="absolute bottom-0.5 right-1 text-[9px] text-[#8C7E70] font-bold"
                    >0</span
                  >
                </div>

                <div
                  onclick="selectBagItem('chocolate')"
                  id="slot_chocolate"
                  class="relative bg-white p-1.5 rounded-lg border border-[#EAE6DF] cursor-pointer flex flex-col items-center justify-center"
                >
                  <span class="text-sm">🍫</span><span class="text-[8px] leading-tight text-[#5C5247]">摸魚巧克力</span>
                  <span
                    id="count_chocolate"
                    class="absolute bottom-0.5 right-1 text-[9px] text-[#8C7E70] font-bold"
                    >0</span
                  >
                </div>

                <div
                  onclick="selectBagItem('donut')"
                  id="slot_donut"
                  class="relative bg-white p-1.5 rounded-lg border border-[#EAE6DF] cursor-pointer flex flex-col items-center justify-center"
                >
                  <span class="text-sm">🍩</span><span class="text-[8px] leading-tight text-[#5C5247]">摸魚甜甜圈</span>
                  <span
                    id="count_donut"
                    class="absolute bottom-0.5 right-1 text-[9px] text-[#8C7E70] font-bold"
                    >0</span
                  >
                </div>

                <div
                  onclick="selectBagItem('biscuit')"
                  id="slot_biscuit"
                  class="relative bg-white p-1.5 rounded-lg border border-[#EAE6DF] cursor-pointer flex flex-col items-center justify-center"
                >
                  <span class="text-sm">🥨</span><span class="text-[8px] leading-tight text-[#5C5247]">薪水小餅乾</span>
                  <span
                    id="count_biscuit"
                    class="absolute bottom-0.5 right-1 text-[9px] text-[#8C7E70] font-bold"
                    >0</span
                  >
                </div>
              </div>
            </div>
          </div>

          <!-- 互動 -->
			<div id="panelAction" class="hidden grid grid-cols-3 gap-2">
			
			<button
				onclick="dailyCheckIn()"
				id="checkinBtn"
				class="bg-emerald-50 hover:bg-emerald-100 text-emerald-800 rounded-xl text-[10px] font-bold transition cursor-pointer border border-emerald-200 flex flex-col items-center justify-center"
			>
				🎁 每日簽到
			</button>
			
			<button
				onclick="playToy()"
				class="bg-white hover:bg-[#E5A953] hover:text-white text-[#7C7063] rounded-xl text-[10px] font-bold transition cursor-pointer border border-[#EAE6DF] flex flex-col items-center justify-center"
			>
				🎾 摸摸頭
			</button>
			
			<button
				onclick="giveHug()"
				class="bg-white hover:bg-pink-400 hover:text-white text-[#7C7063] rounded-xl text-[10px] font-bold transition cursor-pointer border border-[#EAE6DF] flex flex-col items-center justify-center"
			>
				🫂 抱抱充電
			</button>
			
			<button
				onclick="sendDinoToWork()"
				id="workBtn"
				class="bg-white hover:bg-[#94A684] hover:text-white text-stone-700 rounded-xl text-[10px] font-bold transition cursor-pointer border border-[#EAE6DF] flex flex-col items-center justify-center"
			>
				💼 派打工
			</button>
			
			<button
				onclick="punchAir()"
				class="bg-white hover:bg-rose-500 hover:text-white text-[#7C7063] rounded-xl text-[10px] font-bold transition cursor-pointer border border-[#EAE6DF] flex flex-col items-center justify-center"
			>
				🥊 揮拳發洩
			</button>
			
			<button
				onclick="takePaidPoop()"
				class="bg-white hover:bg-amber-600 hover:text-white text-[#7C7063] rounded-xl text-[10px] font-bold transition cursor-pointer border border-[#EAE6DF] flex flex-col items-center justify-center"
			>
				☕ 帶薪大便
			</button>

      function startWork(durationSeconds, workTypeName, event) {
        if (event) event.stopPropagation();
        localStorage.setItem(
          "dino_work_finish",
          Date.now() + durationSeconds * 1000,
        );
        localStorage.setItem("dino_work_type", workTypeName);
        isWorking = true;
        updateWorkStateUI();
      }

      function updateWorkStateUI() {
        const finishTime = parseInt(localStorage.getItem("dino_work_finish"));

        if (!finishTime) return;

        const timeLeft = Math.ceil((finishTime - Date.now()) / 1000);
        const workBtn = document.getElementById("workBtn");

        if (timeLeft > 0) {
          isWorking = true;
          updateWorkRestrictionsUI();

          if (workBtn) {
            workBtn.disabled = true;
            workBtn.innerText = `💼 (${timeLeft}秒)`;
          }

          document.getElementById("dinoIcon").innerText = "💼";
          const titleEl = document.getElementById("dinoTitle");
          if (titleEl) titleEl.innerText = "狀態：打工中 " + timeLeft + "秒";
          setTimeout(updateWorkStateUI, 1000);
        } else {
          // 先取得工作種類，不能先刪除！
          const workType = localStorage.getItem("dino_work_type") || "半天工";

          // 各種工作的報酬範圍
          const workRewards = {
            半天工: [15, 34],
            通宵加班: [15, 34],
            出差: [15, 34],
            辦公室大掃除: [40, 60],
            倉庫整理: [70, 100],
            系統維護專案: [120, 160],
          };

          const [minReward, maxReward] = workRewards[workType] || [15, 34];

          const earned =
            Math.floor(Math.random() * (maxReward - minReward + 1)) + minReward;

          // 發放金幣
          dinoStats.coins += earned;

          localStorage.setItem("dino_coins", dinoStats.coins);

          document.getElementById("coinCount").innerText = dinoStats.coins;

          // 額外零食獎勵
          const bonusSnack = getWorkSnackReward();
          updateBagUI();

          let resultMessage = `⟨打工回來！完成「${workType}」，賺了 ${earned} 元！🎉⟩`;

          if (bonusSnack) {
            resultMessage += `\n🍪 意外獲得 ${bonusSnack.emoji}${bonusSnack.name}！`;
          } else {
            resultMessage += "\n今天沒有找到額外零食，下次再加油！";
          }

          // 顯示打工結果
          document.getElementById("dinoSpeech").innerText = resultMessage;

          // 恢復恐龍狀態
          isWorking = false;
          updateWorkRestrictionsUI();

          document.getElementById("dinoIcon").innerText = currentPetEmoji;

          // 恢復打工按鈕
          if (workBtn) {
            workBtn.disabled = false;
            workBtn.innerText = "💼 派打工";
          }

          const titleEl = document.getElementById("dinoTitle");
          if (titleEl) titleEl.innerText = "狀態：正常運轉";

          // 更新數值及閒置計時器
          updateStatsUI();
          resetIdleTimer();

          // 最後才清除打工紀錄
          localStorage.removeItem("dino_work_finish");
          localStorage.removeItem("dino_work_type");
        }
      }

      function updateStatsUI() {
        document.getElementById("hungerBar").style.width =
          dinoStats.hunger + "%";

          dinoStats.hunger + "%";

        const moodBar = document.getElementById("moodBar");
        hungerBar.classList.toggle("stat-critical", dinoStats.hunger <= 0);
        thirstBar.classList.toggle("stat-critical", dinoStats.thirst <= 0);

          iconEl.innerText = "🥤";

      function claimEmergencySupply() {
        if (isWorking || isSleeping) return;
        const today = getTodayKey();
        if (localStorage.getItem("dino_emergency_supply_date") === today) {
          updateZeroCareDialogue();
          return;
        }
        if (dinoStats.hunger <= 0) dinoStats.hunger = Math.min(100, dinoStats.hunger + 35);
        if (dinoStats.thirst <= 0) dinoStats.thirst = Math.min(100, dinoStats.thirst + 35);

        if (!estimate || !stock) return;
        const qty = Math.min(50, Math.max(1, parseInt(document.getElementById(`${type}Qty`)?.value) || 1));

        const sellNet = canSell ? stock.price * qty - Math.ceil(stock.price * qty * stockFeeRates.sell) : null;
        estimate.innerText = `買 $${buyTotal} · 賣 ${canSell ? "$" + sellNet : "未持有"}`;
        estimate.title = `買進總額（含手續費）$${buyTotal}／賣出實拿（扣手續費）${canSell ? "$" + sellNet : "尚未持有，無法賣出"}`;

      function updateStockPrices() {
        Object.keys(stockMarket).forEach((type) => {
          const stock = stockMarket[type];
          const profile = stockProfiles[type];
          let change = Math.floor(Math.random() * (profile.volatility * 2 + 1)) - profile.volatility;
          if (stock.price > profile.center) change -= 1;
          else if (stock.price < profile.center) change += 1;
          stock.price = Math.max(profile.min, Math.min(profile.max, stock.price + change));
        });
        saveStockPrices();
        updateStockUI();
      }

        if (isSleeping) return;

      function buyStock(type) {
        resetIdleTimer();
        const amount = Math.min(50, Math.max(1, parseInt(document.getElementById(`${type}Qty`).value) || 1));
        const stock = stockMarket[type];
        const subtotal = stock.price * amount;
        const fee = Math.ceil(subtotal * stockFeeRates.buy);
        const cost = subtotal + fee;
        if (dinoStats.coins < cost) {
          stockActionNotice = `金幣不足：買進 ${amount} 張需 $${cost}（含手續費 $${fee}）`;
          updateStockUI();
          return;
        }
        dinoStats.coins -= cost;
        stock.holding += amount;
        stock.totalCost += cost;
        localStorage.setItem("dino_coins", dinoStats.coins);
        localStorage.setItem(`stock_${type}_holding`, stock.holding);
        localStorage.setItem(`stock_${type}_cost`, stock.totalCost);
        document.getElementById("coinCount").innerText = dinoStats.coins;
        stockActionNotice = `買進 ${amount} 張，成交 $${subtotal}，手續費 $${fee}`;
        updateStockUI();
      }

      function sellStock(type) {
        resetIdleTimer();
        const amount = Math.min(50, Math.max(1, parseInt(document.getElementById(`${type}Qty`).value) || 1));
        const stock = stockMarket[type];
        if (stock.holding < amount) {
          stockActionNotice = "持有張數不足";
          updateStockUI();
          return;
        }
        const gross = stock.price * amount;
        const fee = Math.ceil(gross * stockFeeRates.sell);
        const net = gross - fee;
        const avgCost = stock.holding > 0 ? stock.totalCost / stock.holding : 0;
        stock.holding -= amount;
        stock.totalCost = stock.holding > 0 ? Math.max(0, stock.totalCost - avgCost * amount) : 0;
        dinoStats.coins += net;
        localStorage.setItem("dino_coins", dinoStats.coins);
        localStorage.setItem(`stock_${type}_holding`, stock.holding);
        localStorage.setItem(`stock_${type}_cost`, stock.totalCost);
        document.getElementById("coinCount").innerText = dinoStats.coins;
        stockActionNotice = `賣出 ${amount} 張，成交 $${gross}，扣手續費 $${fee}，入帳 $${net}`;
        updateStockUI();
      }

      function applyBackupData(saved) {
        if (!saved || typeof saved !== "object") throw new Error("備份資料格式不正確");
        if (saved.coins !== undefined) dinoStats.coins = Math.max(0, Number(saved.coins) || 0);
        ["hunger", "thirst", "mood"].forEach((key) => {
          if (saved[key] !== undefined) dinoStats[key] = Math.max(0, Math.min(100, Number(saved[key]) || 0));
        });
        if (saved.bag && typeof saved.bag === "object") dinoStats.bag = { ...dinoStats.bag, ...saved.bag };
        if (saved.unlocked_pets && typeof saved.unlocked_pets === "object") unlockedPets = saved.unlocked_pets;
        if (saved.current_pet !== undefined) currentPetEmoji = saved.current_pet;
        if (saved.gacha_collection && typeof saved.gacha_collection === "object") gachaCollectionOwned = saved.gacha_collection;

        if (saved.work_snacks && typeof saved.work_snacks === "object") {
          workSnackBag = { ...saved.work_snacks };
          saveWorkSnackBag();
        }
        if (saved.stocks && typeof saved.stocks === "object") {
          Object.keys(stockMarket).forEach((type) => {
            const item = saved.stocks[type];
            if (!item || typeof item !== "object") return;
            const holding = Math.max(0, Math.floor(Number(item.holding) || 0));
            const totalCost = Math.max(0, Number(item.totalCost) || 0);
            const price = Number(item.price);
            stockMarket[type].holding = holding;
            stockMarket[type].totalCost = totalCost;
            if (Number.isFinite(price) && price > 0) {
              stockMarket[type].price = Math.max(stockProfiles[type].min, Math.min(stockProfiles[type].max, Math.round(price)));
            }
            localStorage.setItem(`stock_${type}_holding`, String(holding));
            localStorage.setItem(`stock_${type}_cost`, String(totalCost));
            localStorage.setItem(`stock_${type}_price`, String(stockMarket[type].price));
          });
          localStorage.setItem("stock_cost_includes_buy_fee", "1");
        }
        [["dino_coins", dinoStats.coins], ["dino_bag", JSON.stringify(dinoStats.bag)], ["dino_unlocked_pets", JSON.stringify(unlockedPets)], ["dino_current_pet", currentPetEmoji], ["dino_gacha_collection", JSON.stringify(gachaCollectionOwned)]].forEach(([key, value]) => localStorage.setItem(key, value));

        if (Object.prototype.hasOwnProperty.call(saved, "last_checkin")) {
          if (saved.last_checkin) localStorage.setItem("dino_last_checkin", saved.last_checkin);
          else localStorage.removeItem("dino_last_checkin");
        }
        if (Object.prototype.hasOwnProperty.call(saved, "work_finish")) {
          if (saved.work_finish) localStorage.setItem("dino_work_finish", String(saved.work_finish));
          else localStorage.removeItem("dino_work_finish");
        }
        if (Object.prototype.hasOwnProperty.call(saved, "work_type")) {
          if (saved.work_type) localStorage.setItem("dino_work_type", saved.work_type);
          else localStorage.removeItem("dino_work_type");
        }
        if (Object.prototype.hasOwnProperty.call(saved, "emergency_supply_date")) {
          if (saved.emergency_supply_date) localStorage.setItem("dino_emergency_supply_date", saved.emergency_supply_date);
          else localStorage.removeItem("dino_emergency_supply_date");
        }
        ["hunger", "thirst", "mood"].forEach((key) => localStorage.setItem(`dino_${key}`, String(dinoStats[key])));
        if (document.getElementById("coinCount")) document.getElementById("coinCount").innerText = dinoStats.coins;
        if (document.getElementById("dinoIcon")) document.getElementById("dinoIcon").innerText = currentPetEmoji;

      function importData(e) {
        if (showWorkLockNotice("匯入存檔")) {
          e.target.value = "";
          return;
        }
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (evt) {
          try {
            let json = String(evt.target.result || "")
              .replace(/^\uFEFF/, "")
              .replace("var localDinoData =", "")
              .trim();
            if (json.endsWith(";")) json = json.slice(0, -1);
            const parsed = JSON.parse(json);
            applyBackupData(parsed.data || parsed);
            alert("匯入成功！已還原金幣、狀態、背包、寵物、收藏、打工零食與股票資料。");
            location.reload();
          } catch (err) {
            alert("匯入失敗：檔案格式不正確，或資料內容無法讀取。");
          } finally {
            e.target.value = "";
          }
        };
        reader.readAsText(file);
      }

              button.dataset.wasDisabledBeforeWork = button.disabled ? "true" : "false";

            }
            button.disabled = true;
          } else if (button.dataset.workLocked === "true") {

      function grantRandomMarketFood() {
        const available = Object.keys(foodCatalog).filter((key) => (dinoStats.bag[key] || 0) < 15);
        if (!available.length) return null;
        const key = available[Math.floor(Math.random() * available.length)];
        dinoStats.bag[key] = (dinoStats.bag[key] || 0) + 1;
        localStorage.setItem("dino_bag", JSON.stringify(dinoStats.bag));
        updateBagUI();
        return foodCatalog[key];
      }

      function finishSlotMachine(symbols) {
        if (slotSpinTimer) clearInterval(slotSpinTimer);
        slotSpinTimer = null;
        if (activeMiniGame !== "slot") return;
        const roll = Math.random();
        let reels;
        let cashReward = 0;
        let tier = "miss";
        if (roll < 0.1) {
          reels = ["🧋", "🧋", "🧋"];
          cashReward = 100;
          tier = "jackpot";
        } else if (roll < 0.4) {
          const pair = symbols[Math.floor(Math.random() * symbols.length)];
          const singles = symbols.filter((item) => item !== pair);
          reels = [pair, pair, singles[Math.floor(Math.random() * singles.length)]];
          reels.sort(() => Math.random() - 0.5);
          cashReward = 40;
          tier = "pair";
        } else {
          reels = [];
          while (reels.length < 3) {
            const symbol = symbols[Math.floor(Math.random() * symbols.length)];
            if (!reels.includes(symbol)) reels.push(symbol);
          }
        }
        activeMiniGame = null;
        let prizeText = "沒有連線，這次沒中獎。";
        if (tier !== "miss") {
          dinoStats.coins += cashReward;
          const food = grantRandomMarketFood();
          if (food) {
            prizeText = '🎉 獲得 $' + cashReward + ' 和 ' + food.emoji + ' ' + food.name + ' ×1！';
          } else {
            dinoStats.coins += 5;
            prizeText = '🎉 獲得 $' + (cashReward + 5) + '！食物背包已滿，改補 $5 金幣。';
          }
        }
        saveMiniGameCoins();
        const title = tier === "jackpot" ? "珍奶三連線！大獎！" : tier === "pair" ? "兩個圖示連線！" : "沒有連線";
        showMiniGameMessage('<div class="flex flex-col items-center gap-1 w-full"><span class="font-bold text-purple-700">🧋 ' + title + '</span><div class="flex justify-center gap-2">' + reels.map((item) => '<span class="bg-purple-50 rounded-lg px-3 py-1 text-xl">' + item + '</span>').join("") + '</div><span class="text-[10px] font-bold text-[#5C5247]">' + prizeText + '</span></div>');
      }

      let currentRandomEvent = null;
      let randomEventTimer = null;

      function showRandomOfficeEvent() {
        if (isSleeping || activeMiniGame || currentRandomEvent || dinoStats.hunger <= 0 || dinoStats.thirst <= 0 || dinoStats.mood <= 0) return false;
        const speech = document.getElementById("dinoSpeech");
        if (!speech || speech.querySelector("button, input, select, textarea")) return false;
        currentRandomEvent = randomOfficeEvents[Math.floor(Math.random() * randomOfficeEvents.length)];
        document.getElementById("randomEventTitle").innerText = currentRandomEvent.title;
        document.getElementById("randomEventStory").innerText = currentRandomEvent.story;
        document.getElementById("randomEventChoices").innerHTML = currentRandomEvent.choices.map((choice, index) =>
          '<button type="button" onclick="resolveRandomOfficeEvent(' + index + ')" class="rounded-lg border border-[#EAE6DF] bg-[#F7F5EF] px-2 py-2 text-left text-[10px] font-bold text-[#5C5247] hover:bg-[#EEF2E9]">' + choice.label + '</button>'
        ).join("");
        const overlay = document.getElementById("randomEventOverlay");
        overlay.classList.remove("hidden");
        overlay.classList.add("flex");
        return true;
      }

      function scheduleRandomOfficeEvent(delay) {
        clearTimeout(randomEventTimer);
        randomEventTimer = setTimeout(() => {
          showRandomOfficeEvent();
          scheduleRandomOfficeEvent(120000 + Math.random() * 150000);
        }, delay ?? (120000 + Math.random() * 150000));
      }

      function resolveRandomOfficeEvent(choiceIndex) {
        if (!currentRandomEvent) return;
        const event = currentRandomEvent;
        const choice = event.choices[choiceIndex];
        if (!choice) return;
        currentRandomEvent = null;
        const overlay = document.getElementById("randomEventOverlay");
        overlay.classList.add("hidden");
        overlay.classList.remove("flex");

        const outcome = choice.outcomes[Math.floor(Math.random() * choice.outcomes.length)];
        const details = [outcome.text];
        if (outcome.coins) {
          const delta = Array.isArray(outcome.coins)
            ? Math.floor(Math.random() * (outcome.coins[1] - outcome.coins[0] + 1)) + outcome.coins[0]
            : outcome.coins;
          const actualDelta = delta < 0 ? -Math.min(dinoStats.coins, Math.abs(delta)) : delta;
          dinoStats.coins = Math.max(0, dinoStats.coins + actualDelta);
          details.push((actualDelta >= 0 ? '💰 金幣 +' : '💸 金幣 ') + (actualDelta >= 0 ? '$' + actualDelta : '-$' + Math.abs(actualDelta)));
          saveMiniGameCoins();
        }
        if (outcome.stats) {
          Object.entries(outcome.stats).forEach(([key, delta]) => {
            if (Object.prototype.hasOwnProperty.call(dinoStats, key) && key !== "coins" && key !== "bag") {
              dinoStats[key] = Math.max(0, Math.min(100, dinoStats[key] + delta));
              details.push(({ hunger: "🍗 飢餓", thirst: "☕ 口渴", mood: "✨ 心情" })[key] + (delta >= 0 ? ' +' : ' ') + delta + '%');
              localStorage.setItem("dino_" + key, String(dinoStats[key]));
            }
          });
          updateStatsUI();
        }
        if (outcome.food) {
          const food = grantRandomMarketFood();
          if (food) details.push('🎁 獲得 ' + food.emoji + food.name + ' ×1');
          else { dinoStats.coins += 5; details.push('🎒 食物背包已滿，改得 $5'); saveMiniGameCoins(); }
        }
        if (outcome.item) {
          details.push(awardRandomEventCollectionItem(outcome.item));
        }
        showMiniGameMessage('<div class="flex flex-col gap-1 w-full"><span class="font-bold text-amber-700">' + event.title + '</span><span class="text-[10px] text-[#5C5247]">' + details.join('　') + '</span></div>');
        scheduleRandomOfficeEvent(120000 + Math.random() * 150000);
      }

      function awardRandomEventCollectionItem(itemId) {
        const item = gachaCollectionItems.find((entry) => entry.id === itemId);
        if (!item) return "";
        if (gachaCollectionOwned[item.id]) {
          const coins = item.rarity === "rare" ? 25 : 5;
          dinoStats.coins += coins;
          saveMiniGameCoins();
          return '重複收藏「' + item.name + '」，折成 $' + coins + ' 金幣！';
        }
        gachaCollectionOwned[item.id] = true;
        localStorage.setItem("dino_gacha_collection", JSON.stringify(gachaCollectionOwned));
        updateGachaCollectionCount();
        return '🎉 收藏圖鑑新增：' + item.emoji + item.name + '！';
      }
      function updateGachaCollectionCount() {
        const el = document.getElementById("collectionCount");
        if (el) el.innerText = Object.keys(gachaCollectionOwned).filter((id) => gachaCollectionOwned[id]).length + " / " + gachaCollectionItems.length;
      }

      function showGachaCollection() {
        if (activeMiniGame) return showMiniGameBusyMessage();
        updateGachaCollectionCount();
        const count = Object.keys(gachaCollectionOwned).filter((id) => gachaCollectionOwned[id]).length;
        const cards = gachaCollectionItems.map((item) => {
          const owned = !!gachaCollectionOwned[item.id];
          const rarity = item.rarity === "rare" ? "✨稀有" : "一般";
          return '<div class="rounded-lg border border-[#EAE6DF] bg-white p-1.5 text-center"><div class="text-base">' + (owned ? item.emoji : "❔") + '</div><div class="text-[9px] font-bold">' + (owned ? item.name : "未收集") + '</div><div class="text-[8px] text-[#8C7E70]">' + rarity + '</div></div>';
        }).join("");
        showMiniGameMessage('<div class="flex flex-col gap-1 w-full"><div class="font-bold text-[10px] text-emerald-800">📚 收藏圖鑑　' + count + ' / ' + gachaCollectionItems.length + '</div><div class="grid grid-cols-2 gap-1 max-h-[76px] overflow-y-auto">' + cards + '</div><button type="button" onclick="closeGachaCollection()" class="text-[9px] text-[#8C7E70] underline self-end">收起圖鑑</button></div>');
      }

      function closeGachaCollection() {
        document.getElementById("dinoSpeech").innerText = "「吼——（隕石來啦!🔥）」";
      }
      window.addEventListener("mousemove", resetIdleTimer);
      scheduleRandomOfficeEvent();
